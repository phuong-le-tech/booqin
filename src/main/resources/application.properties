server.port=${PORT:8080}
spring.application.name=BooqIn
spring.jpa.open-in-view=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/database;
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
security.jwt.token.secret-key=${JWT_SECRET}
spring.main.allow-circular-references=true
server.servlet.context-path=/
novelists.file.path=src/main/resources/novelists.txt
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
spring.retry.max-attempts=10
spring.retry.backoff.delay=100
security.jwt.token.access-expiration=300000
security.jwt.token.refresh-expiration=604800000
file.upload-dir=data/images/
app.image-base-url=http://localhost:8080/api/v1/books/images/
app.clientUrls.react=http://localhost:5173/
app.clientUrls.thymeleaf=http://localhost:${server.port}/
app.defaultUrl=http://localhost:5173/