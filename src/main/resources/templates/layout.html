<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'BooqIn'">BooqIn</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .main-container {
            min-height: calc(100vh - 4rem); /* 100vh - navbar height */
        }
        .navbar-color {
            background-color: #111827;
        }
        .footer-color {
            background-color: #111827;
        }
    </style>
</head>
<body class="bg-gray-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="main-container py-6">
    <div class="container mx-auto px-4" th:insert="~{${content}}">
    </div>
</main>

<footer class="footer-color text-white py-4">
    <div class="container mx-auto px-4 text-center text-sm">
        <p>&copy; 2025 BooqIn. All rights reserved.</p>
    </div>
</footer>
</body>
</html>
