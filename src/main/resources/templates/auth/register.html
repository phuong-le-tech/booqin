<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Inscription</h1>

    <form action="/auth/register" method="post" class="space-y-4">
        <div>
            <label for="firstName" class="block text-gray-700">Prénom :</label>
            <input type="text" id="firstName" name="firstName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"/>
        </div>
        <div>
            <label for="lastName" class="block text-gray-700">Nom :</label>
            <input type="text" id="lastName" name="lastName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"/>
        </div>
        <div>
            <label for="email" class="block text-gray-700">Email :</label>
            <input type="email" id="email" name="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"/>
        </div>
        <div>
            <label for="password" class="block text-gray-700">Mot de passe :</label>
            <input type="password" id="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"/>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition duration-300">S'inscrire</button>
    </form>

    <p class="mt-4 text-center">Déjà inscrit ? <a href="/auth/login" class="text-blue-600 hover:underline">Connectez-vous ici</a></p>
</div>

</body>
</html>
