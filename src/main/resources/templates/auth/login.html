<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
</head>
<body>
<h1>Connexion</h1>

<!-- Show error if present -->
<div th:if="${error}" style="color: red;">
    <p th:text="${error}"></p>
</div>

<form action="#" th:action="@{/auth/login}" th:object="${loginDto}" method="post">
    <label for="login">Email :</label>
    <input type="email" id="login" th:field="*{login}" required />

    <label for="password">Mot de passe :</label>
    <input type="password" id="password" th:field="*{password}" required />

    <button type="submit">Se connecter</button>
</form>

<p>Pas encore de compte ? <a th:href="@{/auth/register}">Inscrivez-vous ici</a></p>
</body>
</html>
