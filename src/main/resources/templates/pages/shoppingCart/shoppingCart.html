<div class="container mx-auto px-4 py-8">
    <h2 class="text-3xl font-bold text-center mb-8 text-gray-800">Your Cart</h2>

    <!-- Empty cart -->
    <div th:if="${cart == null or cart.books.isEmpty()}" class="bg-white rounded-lg shadow-md p-8 text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mx-auto text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <p class="text-xl font-medium text-gray-700 mb-4">Your cart is empty.</p>
        <p class="text-gray-500 mb-6">Add books to your cart to start shopping</p>
        <a th:href="@{/books}" class="inline-block px-6 py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition duration-300 transform hover:scale-105">
            Browse the store
        </a>
    </div>

    <!-- Cart with products -->
    <div th:if="${cart != null and not cart.books.isEmpty()}" class="bg-white rounded-lg shadow-md overflow-hidden">
        <!-- Table header -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">
                        Title
                    </th>
                    <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">
                        Author
                    </th>
                    <th class="px-6 py-3 text-right text-base font-medium text-gray-700 uppercase tracking-wider">
                        Actions
                    </th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="book : ${cart.books}" class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="font-medium text-gray-900" th:text="${book.title}">Book title</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-gray-700" th:text="${book.authorNames != null and !book.authorNames.isEmpty() ? #strings.listJoin(book.authorNames, ', ') : 'Unknown author'}">Author</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right font-medium">
                        <form th:action="@{/cart/remove-book}" method="post">
                            <input type="hidden" name="userId" th:value="${cart.userId}">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            <button type="submit" class="text-red-600 hover:text-red-900 flex items-center justify-end w-full">
                                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                                Remove
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Order summary -->
        <div class="p-6 border-t border-gray-200 bg-gray-50">
            <div class="flex justify-end space-y-2 flex-col items-end">
                <p class="text-sm text-gray-700"><span class="font-medium">Subtotal:</span> <span th:text="${#numbers.formatDecimal(subtotal, 1, 2) + ' €'}" class="font-semibold">0.00 €</span></p>
                <p class="text-sm text-gray-700"><span class="font-medium">Shipping:</span> <span class="font-semibold">5.99 €</span></p>
                <p class="text-lg font-bold text-gray-900 mt-2"><span>Total:</span> <span th:text="${#numbers.formatDecimal(total, 1, 2) + ' €'}" class="text-indigo-700">0.00 €</span></p>

                <div class="flex mt-4 space-x-4">
                    <form th:action="@{/cart/clear-cart}" method="post">
                        <input type="hidden" name="userId" th:value="${cart.userId}">
                        <button type="submit" class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50 flex items-center">
                            <span>🗑️</span>
                            <span class="ml-1">Empty cart</span>
                        </button>
                    </form>

                    <form th:action="@{/payment/checkout}" method="post">
                        <input type="hidden" name="cartId" th:value="${cart.id}">
                        <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50 font-medium">
                            Pay now
                        </button>
                    </form>
                </div>

                <p class="text-center text-gray-500 text-sm mt-4 italic">
                    100% secure payment
                </p>
            </div>
        </div>
    </div>

    <!-- Error or success messages -->
    <div th:if="${error}" class="mt-4 p-4 bg-red-100 border border-red-300 text-red-700 rounded-md">
        <p th:text="${error}">Error message</p>
    </div>

    <div th:if="${success}" class="mt-4 p-4 bg-green-100 border border-green-300 text-green-700 rounded-md">
        <p th:text="${success}">Success message</p>
    </div>
</div>
