<div class="flex items-center justify-center min-h-screen bg-gray-100 py-12">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-lg w-full mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Inscription</h1>

        <!-- Affiche l'erreur si présente -->
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <p th:text="${error}">Message d'erreur</p>
        </div>

        <form th:action="@{/auth/register}" method="post" th:object="${registerDto}" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="firstName" class="block text-gray-700 mb-1">Prénom :</label>
                    <input type="text" id="firstName" name="firstName" th:value="${firstName}" required
                           class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
                </div>
                <div>
                    <label for="lastName" class="block text-gray-700 mb-1">Nom :</label>
                    <input type="text" id="lastName" name="lastName" th:value="${lastName}" required
                           class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
                </div>
            </div>

            <div>
                <label for="email" class="block text-gray-700 mb-1">Email :</label>
                <input type="email" id="email" name="email" th:value="${email}" required
                       class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
            </div>

            <div>
                <label for="password" class="block text-gray-700 mb-1">Mot de passe :</label>
                <input type="password" id="password" name="password" th:value="${password}" required
                       class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
            </div>

            <div class="pt-4 border-t border-gray-200">
                <h3 class="text-lg font-medium text-gray-700 mb-3">Adresse</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="streetNo" class="block text-gray-700 mb-1">Numéro de rue :</label>
                        <input type="text" id="streetNo" name="streetNo" th:value="${streetNumber}" required
                               class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
                    </div>
                    <div>
                        <label for="street" class="block text-gray-700 mb-1">Rue :</label>
                        <input type="text" id="street" name="street" th:value="${streetName}" required
                               class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
                    <div>
                        <label for="city" class="block text-gray-700 mb-1">Ville :</label>
                        <input type="text" id="city" name="city" th:value="${city}" required
                               class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
                    </div>
                    <div>
                        <label for="postalCode" class="block text-gray-700 mb-1">Code postal :</label>
                        <input type="text" id="postalCode" name="postalCode" th:value="${postalCode}" required
                               class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition duration-300 mt-4">S'inscrire</button>
        </form>

        <p class="mt-4 text-center">Déjà inscrit ? <a th:href="@{/auth/login}" class="text-blue-600 hover:underline">Connectez-vous</a></p>
    </div>
</div>
