<div class="flex items-center justify-center min-h-screen bg-gray-100 py-12">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Connexion</h1>

        <!-- Affiche l'erreur si présente -->
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <p th:text="${error}">Message d'erreur</p>
        </div>

        <!-- Spring Security attend par défaut un POST sur /login avec "username" et "password" -->
        <form th:action="@{/auth/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-gray-700 mb-1">Email :</label>
                <!-- name="username" (et non "login") -->
                <input type="text" id="username" name="username" required class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
            </div>
            <div>
                <!-- name="password" -->
                <label for="password" class="block text-gray-700 mb-1">Mot de passe :</label>
                <input type="password" id="password" name="password" required class="w-full px-3 py-2 border border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"/>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition duration-300">Se connecter</button>
        </form>

        <p class="mt-4 text-center">Pas de compte ? <a th:href="@{/auth/register}" class="text-blue-600 hover:underline">Inscrivez-vous</a></p>
    </div>
</div>
