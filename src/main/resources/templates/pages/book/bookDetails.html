<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title}">Book Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="container mx-auto px-4 py-8">
    <!-- Navigation back -->
    <div class="flex justify-between items-center mb-6">
        <a href="/books"
           class="text-blue-600 hover:text-blue-800 flex items-center font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Retour à la liste des livres
        </a>
    </div>

    <!-- Book detail card -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
        <div class="flex flex-col md:flex-row">
            <!-- Book Cover -->
            <div class="md:w-1/3 lg:w-1/4">
                <!-- Utilisation de classes CSS prédéfinies pour les couleurs de fond -->
                <div th:class="${'w-full h-64 md:h-full flex items-center justify-center text-white font-bold text-6xl ' +
                              (book.id % 7 == 0 ? 'bg-blue-900' :
                               book.id % 7 == 1 ? 'bg-blue-800' :
                               book.id % 7 == 2 ? 'bg-blue-700' :
                               book.id % 7 == 3 ? 'bg-blue-600' :
                               book.id % 7 == 4 ? 'bg-blue-500' :
                               book.id % 7 == 5 ? 'bg-blue-400' : 'bg-blue-300')}">
                    <span th:text="${#strings.substring(book.title, 0, 1).toUpperCase()}">A</span>
                </div>
            </div>

            <!-- Book Details -->
            <div class="p-6 md:p-8 md:w-2/3 lg:w-3/4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2" th:text="${book.title}">Titre du livre</h1>
                    <div>
                        <div class="flex items-center space-x-2">
                            <form method="post" th:action="@{/books/vote}">
                                <input type="hidden" name="bookId" th:value="${book.id}" />
                                <button type="submit" name="voteType" value="UPVOTE" class="text-sm text-gray-600 bg-gray-200 px-2 py-1 rounded hover:bg-green-200" th:classappend="${user != null && userVote == 'UPVOTE'} ? 'bg-green-200' : ''">
                                    Upvotes: <span class="font-medium" th:text="${votes.upvoteCount}">0</span>
                                </button>
                                <button type="submit" name="voteType" value="DOWNVOTE" class="text-sm text-gray-600 bg-gray-200 px-2 py-1 rounded hover:bg-red-200" th:classappend="${user != null && userVote == 'DOWNVOTE'} ? 'bg-red-200' : ''">
                                    Downvotes: <span class="font-medium" th:text="${votes.downvoteCount}">0</span>
                                </button>
                            </form>
                            <button class="text-sm text-gray-600 bg-gray-200 px-2 py-1 rounded">
                                Score: <span class="font-medium" th:text="${votes.score}">0</span>
                            </button>
                        </div>
                    </div>
                </div>
                <!-- Auteurs avec troncation -->
                <div class="mb-6">
                    <p class="text-lg text-blue-700 font-medium authors-display">
                        Par
                        <!-- Affiche jusqu'à 3 auteurs -->
                        <span class="authors-visible" th:if="${book.authors != null && !book.authors.isEmpty()}">
                            <span th:each="author, iterStat : ${book.authors}" th:if="${iterStat.index < 3}">
                                <span th:text="${author.firstName + ' ' + author.lastName}"></span><span th:if="${!iterStat.last && iterStat.index < 2}">, </span>
                            </span>
                            <!-- S'il y a plus de 3 auteurs, ajoute un '+X' cliquable -->
                            <span th:if="${book.authors.size() > 3}" class="text-blue-500 hover:text-blue-700 cursor-pointer ml-1 toggle-authors">
                                <span th:text="${' +' + (book.authors.size() - 3) + ' autres'}"></span>
                            </span>
                        </span>
                    </p>

                    <!-- Liste complète des auteurs (cachée par défaut) -->
                    <div class="authors-full hidden mt-3 pl-4 border-l-2 border-blue-200 text-blue-700">
                        <p class="mb-1 font-medium">Tous les auteurs:</p>
                        <ul class="space-y-1">
                            <li th:each="author : ${book.authors}"
                                th:text="${author.firstName + ' ' + author.lastName}"
                                class="text-blue-600">
                            </li>
                        </ul>
                        <p class="mt-2">
                            <span class="text-blue-500 hover:text-blue-700 cursor-pointer text-sm toggle-authors">
                                Masquer la liste complète
                            </span>
                        </p>
                    </div>

                    <p class="text-sm text-gray-500 mt-1" th:if="${book.publicationDate != null}">
                        Publié le: <span th:text="${#dates.format(book.publicationDate, 'dd MMMM yyyy')}">Date de publication</span>
                    </p>
                </div>

                <!-- ISBNs avec troncation -->
                <div class="mb-6 p-4 bg-gray-50 rounded-lg" th:if="${book.isbns != null && !book.isbns.isEmpty()}">
                    <h2 class="text-lg font-semibold text-gray-700 mb-2">ISBN</h2>

                    <!-- Affiche jusqu'à 2 ISBN -->
                    <ul class="space-y-1 isbns-visible">
                        <li th:each="isbn, isbnStat : ${book.isbns}" th:if="${isbnStat.index < 2}"
                            class="text-gray-600 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-blue-500" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
                            </svg>
                            <span th:text="${isbn}">ISBN</span>
                        </li>
                        <!-- S'il y a plus de 2 ISBN, ajoute un '+X' cliquable -->
                        <li th:if="${book.isbns.size() > 2}" class="text-blue-500 hover:text-blue-700 cursor-pointer ml-6 toggle-isbns">
                            <span th:text="${'+' + (book.isbns.size() - 2) + ' autres ISBN'}"></span>
                        </li>
                    </ul>

                    <!-- Liste complète des ISBN (cachée par défaut) -->
                    <div class="isbns-full hidden mt-3 pl-4 border-l-2 border-blue-200">
                        <p class="mb-1 font-medium text-gray-700">Tous les ISBN:</p>
                        <ul class="space-y-1">
                            <li th:each="isbn : ${book.isbns}" class="text-gray-600 flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-blue-500" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
                                </svg>
                                <span th:text="${isbn}">ISBN</span>
                            </li>
                        </ul>
                        <p class="mt-2">
                            <span class="text-blue-500 hover:text-blue-700 cursor-pointer text-sm toggle-isbns">
                                Masquer la liste complète
                            </span>
                        </p>
                    </div>
                    <!-- Catégories -->
                    <div class="mb-6" th:if="${book.categories != null && !book.categories.isEmpty()}">
                        <h2 class="text-lg font-semibold text-gray-700 mb-2">Catégories</h2>
                        <div class="flex flex-wrap gap-2">
                            <span th:each="category : ${book.categories}"
                                  th:text="${category}"
                                  class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium">
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-700 mb-3">Description</h2>
                    <div class="prose prose-blue max-w-none text-gray-700">
                        <p class="whitespace-pre-line" th:text="${book.description}">Description du livre</p>
                    </div>
                </div>

                <!-- Dates -->
                <div class="mt-6 pt-4 border-t border-gray-700 text-sm text-gray-500 flex flex-col sm:flex-row sm:justify-between">
                    <!--<p>Ajouté le <span th:text="${#dates.format(book.createdAt, 'dd MMMM yyyy')}">Date de création</span></p>
                    <p>Dernière mise à jour le <span th:text="${#dates.format(book.updatedAt, 'dd MMMM yyyy')}">Date de mise à jour</span></p>-->
                </div>
            </div>
        </div>
    </div>
    <!-- Comments Section -->
    <div th:replace="~{fragments/commentSection :: commentSection(entityId=${book.id}, entityType='BOOK', comments=${comments}, commentCount=${commentCount})}"></div>
    <div th:replace="~{fragments/commentSection :: commentScripts}"></div>
</div>

<!-- JavaScript pour les interactions -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Toggle pour afficher/masquer la liste complète des auteurs
        const authorToggleButtons = document.querySelectorAll('.toggle-authors');
        authorToggleButtons.forEach(button => {
            button.addEventListener('click', function() {
                const authorsFullList = document.querySelector('.authors-full');
                const authorsVisible = document.querySelector('.authors-visible');
                if (authorsFullList.classList.contains('hidden')) {
                    authorsFullList.classList.remove('hidden');
                    authorsVisible.classList.add('hidden');
                } else {
                    authorsFullList.classList.add('hidden');
                    authorsVisible.classList.remove('hidden');
                }
            });
        });

        // Toggle pour afficher/masquer la liste complète des ISBN
        const isbnToggleButtons = document.querySelectorAll('.toggle-isbns');
        isbnToggleButtons.forEach(button => {
            button.addEventListener('click', function() {
                const isbnsFullList = document.querySelector('.isbns-full');
                const isbnsVisible = document.querySelector('.isbns-visible');
                if (isbnsFullList.classList.contains('hidden')) {
                    isbnsFullList.classList.remove('hidden');
                    isbnsVisible.classList.add('hidden');
                } else {
                    isbnsFullList.classList.add('hidden');
                    isbnsVisible.classList.remove('hidden');
                }
            });
        });

        // Parse query params to handle newly added comments
        const urlParams = new URLSearchParams(window.location.search);
        const highlightCommentId = urlParams.get('highlight');
        const parentReplyId = urlParams.get('parent');

        // If there's a parent reply ID, expand its deep replies section
        if (parentReplyId) {
            // Expand all parent containers to ensure visibility
            const deepRepliesContainer = document.getElementById('deep-replies-' + parentReplyId);
            if (deepRepliesContainer) {
                deepRepliesContainer.style.display = 'block';
            }
        }

        // Highlight the newly added comment if specified
        if (highlightCommentId) {
            setTimeout(() => {
                const commentElement = document.getElementById('comment-' + highlightCommentId);
                if (commentElement) {
                    commentElement.classList.add('bg-yellow-100');
                    commentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // Remove highlight after a few seconds
                    setTimeout(() => {
                        commentElement.classList.remove('bg-yellow-100');
                    }, 3000);
                }
            }, 500); // Small delay to ensure DOM is fully loaded
        }
    });
</script>
</body>
</html>
