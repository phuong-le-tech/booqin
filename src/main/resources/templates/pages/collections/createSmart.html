<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Smart Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-gradient {
            background: linear-gradient(to right, #8b5cf6, #4f46e5);
            color: white;
            padding: 1.5rem;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="header-gradient">
                    <h1 class="h3 mb-2">Create Smart Collection</h1>
                    <p class="text-light opacity-75">Smart collections automatically include books based on your specified criteria</p>
                </div>

                <div class="card-body p-4">
                    <form id="smartCollectionForm">
                        <!-- Error alert (hidden by default) -->
                        <div class="alert alert-danger d-none" id="errorAlert" role="alert"></div>

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label">Collection Title *</label>
                            <input type="text" class="form-control" id="title" required
                                   placeholder="Enter a title for your collection">
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="3"
                                      placeholder="Describe what this collection is about min 10 carac "></textarea>
                        </div>

                        <!-- Visibility -->
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isPublic">
                                <label class="form-check-label" for="isPublic">
                                    Make this collection public
                                </label>
                            </div>
                        </div>

                        <hr class="my-4">

                        <h4 class="mb-3">Collection Criteria</h4>
                        <p class="text-muted mb-4">Books matching these criteria will be automatically added to this collection.</p>

                        <!-- Criteria Type -->
                        <div class="mb-3">
                            <label for="criteriaType" class="form-label">Criteria Type *</label>
                            <select class="form-select" id="criteriaType" required>
                                <option value="AUTHOR">Author Name</option>
                                <option value="GENRE">Book Genre</option>
                                <option value="PUBLICATION_YEAR">Publication Year</option>
                                <option value="TITLE_CONTAINS">Title Contains</option>
                            </select>
                        </div>

                        <!-- Criteria Value -->
                        <div class="mb-4">
                            <label for="criteriaValue" class="form-label">Criteria Value *</label>
                            <input type="text" class="form-control" id="criteriaValue" required
                                   placeholder="Enter criteria value">
                            <div class="form-text" id="criteriaHelp">
                                Example: For genre, enter 'Fantasy', 'Science Fiction', etc.
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="/collections/user" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                Create Smart Collection
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="/collections" class="btn btn-indigo">Back to My Collections</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('smartCollectionForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const isPublic = document.getElementById('isPublic').checked;
        const criteriaType = document.getElementById('criteriaType').value;
        const criteriaValue = document.getElementById('criteriaValue').value;

        const errorAlert = document.getElementById('errorAlert');
        const submitBtn = document.getElementById('submitBtn');

        if (!title.trim() || !criteriaValue.trim()) {
            errorAlert.textContent = 'Please fill in all required fields';
            errorAlert.classList.remove('d-none');
            return;
        }

        // Update criteria help text based on selected type
        document.getElementById('criteriaType').addEventListener('change', function() {
            const helpText = document.getElementById('criteriaHelp');
            const type = this.value;

            if (type === 'AUTHOR') {
                helpText.textContent = "Example: 'J.K. Rowling'";
            } else if (type === 'GENRE') {
                helpText.textContent = "Example: 'Fantasy', 'Science Fiction'";
            } else if (type === 'PUBLICATION_YEAR') {
                helpText.textContent = "Example: '2022' or '2010-2020'";
            } else if (type === 'TITLE_CONTAINS') {
                helpText.textContent = "Example: 'Harry Potter', 'Chronicles'";
            }
        });

        try {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Creating...';

            // Format the criteria as a string TYPE:VALUE
            const data = {
                title: title + " (Smart)",
                description: description,
                isPublic: isPublic,
                criteria: `${criteriaType}:${criteriaValue}`
            };

            // Send request to create collection
            const response = await fetch('/api/v1/collections', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.success) {

                window.location.href = '/collections';
            } else {
                errorAlert.textContent = result.message || 'Failed to create collection';
                errorAlert.classList.remove('d-none');
            }
        } catch (error) {
            console.error('Error creating collection:', error);
            errorAlert.textContent = 'An error occurred. Please try again.';
            errorAlert.classList.remove('d-none');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Smart Collection';
        }
    });
</script>
</body>
</html>
