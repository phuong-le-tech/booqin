<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Public Collections</h1>
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <table class="min-w-full">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Description</th>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Owner</th>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Actions</th>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Number of Books</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
            <tr th:each="collection : ${publicCollections.content}" class="hover:bg-gray-50">
                <td class="px-6 py-4 text-base text-gray-700" th:text="${collection.title}">Collection Title</td>
                <td class="px-6 py-4 text-base text-gray-700" th:text="${collection.description}">Collection Description</td>
                <td class="px-6 py-4 text-base font-medium">
                    <div class="flex space-x-2">
                        <a th:href="@{/collections/{id}(id=${collection.id})}" class="bg-blue-600 px-2 py-1 text-white text-base rounded hover:opacity-90">
                            View
                        </a>
                    </div>
                </td>
                <td class="px-6 py-4 text-base text-gray-600" th:text="${collection.bookCount}">Nb Books</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination controls -->
    <div class="mt-6 flex justify-center" th:if="${publicCollections.totalPages > 1}">
        <nav class="flex items-center">
            <ul class="flex">
                <!-- Previous button -->
                <li th:class="${publicCollections.first} ? 'opacity-50 cursor-not-allowed' : ''">
                    <a th:unless="${publicCollections.first}"
                       th:href="@{/collections/public(page=${publicCollections.number - 1})}"
                       class="px-3 py-1 mx-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">&laquo;</a>
                    <span th:if="${publicCollections.first}"
                          class="px-3 py-1 mx-1 bg-gray-200 text-gray-400 rounded">&laquo;</span>
                </li>

                <!-- Page numbers -->
                <li th:each="pageNumber : ${#numbers.sequence(0, publicCollections.totalPages - 1)}">
                    <a th:href="@{/collections/public(page=${pageNumber})}"
                       th:text="${pageNumber + 1}"
                       th:class="${pageNumber == publicCollections.number} ? 'px-3 py-1 mx-1 bg-blue-600 text-white rounded' : 'px-3 py-1 mx-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300'"></a>
                </li>

                <!-- Next button -->
                <li th:class="${publicCollections.last} ? 'opacity-50 cursor-not-allowed' : ''">
                    <a th:unless="${publicCollections.last}"
                       th:href="@{/collections/public(page=${publicCollections.number + 1})}"
                       class="px-3 py-1 mx-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">&raquo;</a>
                    <span th:if="${publicCollections.last}"
                          class="px-3 py-1 mx-1 bg-gray-200 text-gray-400 rounded">&raquo;</span>
                </li>
            </ul>
        </nav>
    </div>

    <div class="mt-6 text-center">
        <a th:href="@{/}" class="bg-blue-600 inline-block px-4 py-2 text-white rounded-lg hover:opacity-90">Back to Home</a>
    </div>
</div>
