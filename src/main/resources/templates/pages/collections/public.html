<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Public Collections</h1>
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <table class="min-w-full">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Description</th>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Owner</th>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Actions</th>
                <th class="px-6 py-3 text-left text-base font-medium text-gray-700 uppercase tracking-wider">Number of Books</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
            <tr th:each="collection : ${publicCollections.content}" class="hover:bg-gray-50">
                <td class="px-6 py-4 text-base text-gray-700" th:text="${collection.title}">Collection Title</td>
                <td class="px-6 py-4 text-base text-gray-700" th:text="${collection.description}">Collection Description</td>
                <td class="px-6 py-4 text-base text-gray-700" th:text="${collection.userFullName}">Owner</td>
                <td class="px-6 py-4 text-base font-medium">
                    <div class="flex space-x-2">
                        <a th:href="@{/collections/{id}(id=${collection.id})}" class="bg-blue-600 px-2 py-1 text-white text-base rounded hover:opacity-90">
                            View
                        </a>
                    </div>
                </td>
                <td class="px-6 py-4 text-base text-gray-600" th:text="${collection.bookCount}">Nb Books</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination avec paramètres de recherche et de tri -->
    <div class="flex items-center justify-center gap-2 my-6" th:if="${publicCollections.totalPages > 1}"
         th:with="visiblePages=5,
              startPage=${(publicCollections.number - 2 < 0) ? 0 : ((publicCollections.number + 2 >= publicCollections.totalPages) ? (publicCollections.totalPages - visiblePages < 0 ? 0 : publicCollections.totalPages - visiblePages) : publicCollections.number - 2)},
              endPage=${(startPage + visiblePages - 1 >= publicCollections.totalPages) ? (publicCollections.totalPages - 1) : (startPage + visiblePages - 1)}">

        <button class="w-10 h-10 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-blue-600 transition hover:bg-blue-600 hover:text-white"
                th:if="${publicCollections.number > 0}"
                th:onclick="'window.location.href=\'' + @{/collections/public(page=${publicCollections.number - 1})} + '\''">
            <span class="nav-icon">&#8592;</span>
        </button>

        <!-- Premier numéro de page avec ellipsis si nécessaire -->
        <div class="min-w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer transition text-sm text-gray-800 hover:bg-gray-200"
             th:if="${startPage > 0}"
             th:onclick="'window.location.href=\'' + @{/collections/public(page=0)} + '\''">
            <span>1</span>
        </div>

        <div class="flex items-center justify-center text-sm text-gray-500 tracking-wider" th:if="${startPage > 1}">...</div>

        <!-- Pages visibles dans la fenêtre coulissante -->
        <div class="flex items-center gap-1">
            <div class="min-w-9 h-9 rounded-full flex items-center justify-center cursor-pointer transition text-sm"
                 th:each="i : ${#numbers.sequence(startPage, endPage)}"
                 th:classappend="${publicCollections.number == i} ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-800 hover:bg-gray-200'"
                 th:onclick="'window.location.href=\'' + @{/collections/public(page=${i})} + '\''">
                <span th:text="${i + 1}"></span>
            </div>
        </div>

        <!-- Dernier numéro de page avec ellipsis si nécessaire -->
        <div class="flex items-center justify-center text-sm text-gray-500 tracking-wider" th:if="${endPage < publicCollections.totalPages - 2}">...</div>

        <div class="min-w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer transition text-sm text-gray-800 hover:bg-gray-200"
             th:if="${endPage < publicCollections.totalPages - 1}"
             th:onclick="'window.location.href=\'' + @{/collections/public(page=${publicCollections.totalPages - 1})} + '\''">
            <span th:text="${publicCollections.totalPages}"></span>
        </div>

        <button class="w-10 h-10 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-blue-600 transition hover:bg-blue-600 hover:text-white"
                th:if="${publicCollections.number < publicCollections.totalPages - 1}"
                th:onclick="'window.location.href=\'' + @{/collections/public(page=${publicCollections.number + 1})} + '\''">
            <span class="nav-icon">&#8594;</span>
        </button>
    </div>

    <div class="mt-6 text-center">
        <a th:href="@{/}" class="bg-blue-600 inline-block px-4 py-2 text-white rounded-lg hover:opacity-90">Back to Home</a>
    </div>
</div>
