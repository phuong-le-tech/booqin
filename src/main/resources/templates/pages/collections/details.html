<div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-lg w-full">
    <div th:if="${collection}">
        <h1 class="text-4xl font-bold text-indigo-600 mb-6 text-center" th:text="${collection.title}">Collection Title</h1>
        <div class="flex items-center justify-between mb-4">
            <div th:if="${followersCount != null}" class="mb-2">
                <div th:replace="~{fragments/follow-button :: followersCount(entityId=${collection.id}, entityType='COLLECTION', count=${followersCount})}"></div>
            </div>
            <div th:if="${user != null && !isOwner}">
                <div th:replace="~{fragments/follow-button :: followButton(entityId=${collection.id}, entityType='COLLECTION', isFollowing=${isFollowing}, returnUrl=@{/collections/{id}(id=${collection.id})})}"></div>
            </div>
        </div>
        <div class="mb-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-2">Details</h2>
            <form method="post" th:action="@{/collections/vote}">
                <input type="hidden" name="id" th:value="${collection.id}" />
                <div class="flex items-center space-x-2">
                    <button type="submit" name="voteType" value="UPVOTE" class="text-sm text-gray-600 bg-gray-200 px-2 py-1 rounded hover:bg-green-200" th:classappend="${user != null && userVote == 'UPVOTE'} ? 'bg-green-200' : ''">
                        Upvotes: <span class="font-medium" th:text="${votes.upvoteCount}">0</span>
                    </button>
                    <button type="submit" name="voteType" value="DOWNVOTE" class="text-sm text-gray-600 bg-gray-200 px-2 py-1 rounded hover:bg-red-200" th:classappend="${user != null && userVote == 'DOWNVOTE'} ? 'bg-red-200' : ''">
                        Downvotes: <span class="font-medium" th:text="${votes.downvoteCount}">0</span>
                    </button>
                    <span class="text-sm text-gray-600 bg-gray-200 px-2 py-1 rounded">
                        Score: <span class="font-medium" th:text="${votes.score}">0</span>
                    </span>
                </div>
            </form>
            <p class="text-gray-700 text-justify border-t border-gray-200 pt-4" th:text="${collection.description}">
                Collection Description
            </p>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-semibold text-gray-800">Books in This Collection</h2>

            <!-- Pagination -->
            <div class="flex items-center space-x-2">
                <span class="text-sm text-gray-600">Books per page:</span>
                <form th:action="@{/collections/{id}(id=${collection.id})}" method="get" class="inline-block">
                    <input type="hidden" name="page" value="0">
                    <select name="size" onchange="this.form.submit()" class="border rounded p-1 text-sm">
                        <option value="9" th:selected="${pageSize == 9}">9</option>
                        <option value="12" th:selected="${pageSize == 12}">12</option>
                        <option value="15" th:selected="${pageSize == 15}">15</option>
                        <option value="21" th:selected="${pageSize == 21}">21</option>
                        <option value="24" th:selected="${pageSize == 24}">24</option>
                        <option value="27" th:selected="${pageSize == 27}">27</option>
                        <option value="30" th:selected="${pageSize == 30}">30</option>
                    </select>
                </form>
            </div>
        </div>


        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
            <div th:each="book : ${paginatedBooks}" class="bg-gray-50 shadow-md rounded-lg overflow-hidden transition-transform transform hover:scale-105 relative">
                <!-- Badge pour les livres empruntés -->
                <div th:if="${borrowedBooks != null && borrowedBooks.contains(book.id)}" class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded-full z-10">
                    Prêté
                </div>

                <div class="p-6">
                    <h3 class="text-xl font-semibold text-gray-900" th:text="${book.title}">Book Title</h3>
                    <p class="text-gray-500 mb-2" th:text="${book.publicationDate}">Publication Date</p>
                    <p class="text-gray-600 mb-3">
                        Authors:
                        <span th:each="author, iterStat : ${book.authorNames}">
                            <span th:text="${author}"></span>
                            <span th:if="${!iterStat.last}">, </span>
                        </span>
                    </p>

                    <!-- Boutons d'action -->
                    <div class="flex space-x-2 mt-4">
                        <!-- Bouton pour voir les détails du livre -->
                        <a th:href="@{/books/{bookId}(bookId=${book.id}, returnUrl=@{/collections/{collectionId}(collectionId=${collection.id}, page=${currentPage}, size=${pageSize})})}"
                           class="px-3 py-1 bg-blue-500 text-white text-sm rounded-md hover:bg-blue-600 transition-colors">
                            View Details
                        </a>

                        <!-- Supprimer le livre (seulement pour le propriétaire) -->
                        <a th:if="${isOwner}"
                           th:href="@{/collections/{collectionId}/books/{bookId}/remove(collectionId=${collection.id},bookId=${book.id})}"
                           onclick="return confirm('Are you sure you want to remove this book from the collection?');"
                           class="inline-block px-3 py-1 bg-red-600 text-white text-sm rounded-md hover:bg-red-700 transition-colors">
                            Remove
                        </a>

                        <!-- Gestion des prêts (si connecté et livre pas déjà emprunté) -->
                        <th:block th:if="${currentUser != null && (borrowedBooks == null || !borrowedBooks.contains(book.id))}">
                            <!-- Si le livre est déjà dans la liste de prêt -->
                            <form th:if="${lentBooks != null && lentBooks.contains(book.id)}"
                                  th:action="@{/loans/remove-loanable}"
                                  method="post">
                                <input type="hidden" name="bookId" th:value="${book.id}" />
                                <input type="hidden" name="userId" th:value="${currentUser.id}" />
                                <button type="submit"
                                        class="px-3 py-1 text-white text-sm rounded-md transition-colors bg-yellow-500 hover:bg-yellow-600">
                                    Remove from lending
                                </button>
                            </form>

                            <!-- Si le livre n'est pas encore dans la liste de prêt -->
                            <form th:if="${lentBooks == null || !lentBooks.contains(book.id)}"
                                  th:action="@{/loans/make-loanable}"
                                  method="post">
                                <input type="hidden" name="bookId" th:value="${book.id}" />
                                <input type="hidden" name="userId" th:value="${currentUser.id}" />
                                <button type="submit"
                                        class="px-3 py-1 text-white text-sm rounded-md transition-colors bg-green-500 hover:bg-green-600">
                                    Add to lending
                                </button>
                            </form>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

        <!-- Composant de pagination -->
        <div class="flex items-center justify-center gap-2 my-6" th:if="${totalPages > 1}"
             th:with="visiblePages=5,
          startPage=${(currentPage - 2 < 0) ? 0 : ((currentPage + 2 >= totalPages) ? (totalPages - visiblePages < 0 ? 0 : totalPages - visiblePages) : currentPage - 2)},
          endPage=${(startPage + visiblePages - 1 >= totalPages) ? (totalPages - 1) : (startPage + visiblePages - 1)}">

            <!-- Bouton précédent -->
            <a th:if="${currentPage > 0}"
               th:href="@{/collections/{id}(id=${collection.id}, page=${currentPage - 1}, size=${pageSize})}"
               class="w-10 h-10 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-blue-600 transition hover:bg-blue-600 hover:text-white">
                <span class="nav-icon">&#8592;</span>
            </a>
            <span th:unless="${currentPage > 0}" class="w-10 h-10 rounded-full bg-gray-100 opacity-50 border border-gray-200 flex items-center justify-center text-gray-400">
                <span class="nav-icon">&#8592;</span>
            </span>

            <!-- Premier numéro de page avec ellipsis si nécessaire -->
            <a th:if="${startPage > 0}"
               th:href="@{/collections/{id}(id=${collection.id}, page=0, size=${pageSize})}"
               class="min-w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer transition text-sm text-gray-800 hover:bg-gray-200 px-3">
                <span>1</span>
            </a>

            <div class="flex items-center justify-center text-sm text-gray-500 tracking-wider" th:if="${startPage > 1}">...</div>

            <!-- Pages visibles dans la fenêtre coulissante -->
            <div class="flex items-center gap-1">
                <a th:each="i : ${#numbers.sequence(startPage, endPage)}"
                   th:href="@{/collections/{id}(id=${collection.id}, page=${i}, size=${pageSize})}"
                   class="min-w-9 h-9 rounded-full flex items-center justify-center cursor-pointer transition text-sm px-3"
                   th:classappend="${currentPage == i} ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-800 hover:bg-gray-200'">
                    <span th:text="${i + 1}"></span>
                </a>
            </div>

            <!-- Dernier numéro de page avec ellipsis si nécessaire -->
            <div class="flex items-center justify-center text-sm text-gray-500 tracking-wider" th:if="${endPage < totalPages - 2}">...</div>

            <a th:if="${endPage < totalPages - 1}"
               th:href="@{/collections/{id}(id=${collection.id}, page=${totalPages - 1}, size=${pageSize})}"
               class="min-w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer transition text-sm text-gray-800 hover:bg-gray-200 px-3">
                <span th:text="${totalPages}"></span>
            </a>

            <!-- Bouton suivant -->
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/collections/{id}(id=${collection.id}, page=${currentPage + 1}, size=${pageSize})}"
               class="w-10 h-10 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-blue-600 transition hover:bg-blue-600 hover:text-white">
                <span class="nav-icon">&#8594;</span>
            </a>
            <span th:unless="${currentPage < totalPages - 1}" class="w-10 h-10 rounded-full bg-gray-100 opacity-50 border border-gray-200 flex items-center justify-center text-gray-400">
        <span class="nav-icon">&#8594;</span>
    </span>
        </div>

        <!-- Bouton pour ajouter un livre (seulement pour le propriétaire) -->
        <div class="mt-6" th:if="${isOwner}">
            <a th:href="@{/collections/{collectionId}/books/add(collectionId=${collection.id})}"
               class="inline-block px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition duration-300">
                Add Book
            </a>
        </div>

        <div class="mt-6 space-x-4 text-center">
            <a th:href="@{/}" class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition duration-300">Back to Home</a>
            <a th:href="@{/collections}" class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition duration-300">Back to My Collections</a>
        </div>
    </div>
    <!-- Message si la collection n'est pas trouvée -->
    <div th:unless="${collection}" class="text-center text-red-500 mt-8">
        <p>Collection not found.</p>
    </div>
</div>

<div>
    <!-- Section de commentaires -->
    <div th:replace="~{fragments/commentSection :: commentSection(entityId=${collection.id}, entityType='COLLECTION', comments=${comments}, commentCount=${commentCount})}"></div>
    <div th:replace="~{fragments/commentSection :: commentScripts}"></div>
</div>
