<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un livre à prêter | BooqIn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'light-blue': '#3B82F6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
<div class="container mx-auto px-4 py-12 max-w-3xl">
    <!-- Alerts pour les messages flash -->
    <div th:if="${successMessage}" class="mb-6 bg-green-100 border border-green-300 text-green-700 px-4 py-3 rounded-lg">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="mb-6 bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded-lg">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="mx-auto max-w-md">
        <h1 class="text-3xl font-bold mb-8 text-center text-light-blue">Ajouter un livre à prêter</h1>

        <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
            <div class="p-6">
                <form th:action="@{/loans/make-loanable}" method="post">
                    <div class="mb-6">
                        <label for="bookId" class="block text-sm font-medium text-gray-700 mb-1">ID du livre</label>
                        <input type="number" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-light-blue focus:border-transparent"
                               id="bookId" name="bookId" required th:value="${bookId != null ? bookId : ''}">
                        <p class="mt-1 text-sm text-gray-500">
                            Entrez l'ID du livre que vous souhaitez ajouter à votre liste de prêts.
                        </p>
                    </div>

                    <div class="mb-6">
                        <label for="userId" class="block text-sm font-medium text-gray-700 mb-1">Votre ID utilisateur</label>
                        <input type="number" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-light-blue focus:border-transparent"
                               id="userId" name="userId" required>
                        <p class="mt-1 text-sm text-gray-500">
                            Entrez votre ID utilisateur pour confirmer que vous êtes le propriétaire du livre.
                        </p>
                    </div>

                    <div class="grid grid-cols-1 gap-3 mt-8">
                        <button type="submit" class="w-full bg-light-blue hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                            Ajouter à ma liste de prêts
                        </button>
                        <a th:href="@{/loans(userId=${param.userId != null ? param.userId : ''})}"
                           class="w-full border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors text-center">
                            Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
