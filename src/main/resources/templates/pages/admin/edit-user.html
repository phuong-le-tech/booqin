<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User - BooqIn Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="flex flex-col min-h-screen px-4 py-6 sm:py-12">
  <div class="w-full max-w-3xl mx-auto">
    <div class="bg-white py-6 px-4 sm:py-8 sm:px-6 shadow rounded-lg mb-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800">Edit User</h2>
        <a th:href="@{/admin?tab=users}" class="text-blue-600 hover:text-blue-800 flex items-center">
          Back to users
        </a>
      </div>

      <!-- Error message if any -->
      <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
        <span th:text="${error}">Error message</span>
      </div>

      <!-- User edit form -->
      <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" method="post">
        <div class="space-y-6">
          <!-- Hidden ID field -->
          <input type="hidden" id="id" name="id" th:value="${user.id}">

          <!-- First Name -->
          <div>
            <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
            <input type="text" id="firstName" name="firstName" th:value="${user.firstName}"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                   required>
          </div>

          <!-- Last Name -->
          <div>
            <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
            <input type="text" id="lastName" name="lastName" th:value="${user.lastName}"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                   required>
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="email" name="email" th:value="${user.email}"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                   required>
          </div>

          <!-- Role Selection -->
          <div>
            <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
            <select id="role" name="role"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
              <option value="USER" th:selected="${role == 'USER'}">USER</option>
              <option value="ADMIN" th:selected="${role == 'ADMIN'}">ADMIN</option>
            </select>
          </div>

          <!-- Submit & Cancel buttons -->
          <div class="flex justify-end space-x-3">
            <a th:href="@{/admin?tab=users}"
               class="py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
              Cancel
            </a>
            <button type="submit"
                    class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
              Update User
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
