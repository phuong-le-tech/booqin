<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="flex items-center justify-center min-h-screen px-4 py-6 sm:py-12">
    <div class="w-full max-w-2xl">
        <div class="bg-white py-6 px-4 sm:py-8 sm:px-6 md:px-10 shadow rounded-lg mb-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800">My Profile</h2>

                <!-- Edit/Cancel Button -->
                <div th:if="${!isEditing}">
                    <a href="/profile/edit" class="flex items-center py-2 px-4 rounded-md text-sm font-medium bg-blue-600 text-white hover:bg-blue-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 0L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        Edit Profile
                    </a>
                </div>
                <div th:if="${isEditing}">
                    <a href="/profile" class="flex items-center py-2 px-4 rounded-md text-sm font-medium bg-gray-500 text-white hover:bg-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        Cancel
                    </a>
                </div>
            </div>

            <!-- Success or error message -->
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" role="alert">
                <span th:text="${success}">Success message</span>
            </div>
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
                <span th:text="${error}">Error message</span>
            </div>

            <!-- Edit Form -->
            <div th:if="${isEditing}">
                <form th:action="@{/profile/edit}" method="post" th:object="${userUpdate}" class="space-y-4 sm:space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                        <div>
                            <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">
                                First Name
                            </label>
                            <input
                                    type="text"
                                    id="firstName"
                                    th:field="*{firstName}"
                                    required
                                    class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                      text-gray-700 placeholder-gray-400
                                      focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            />
                        </div>
                        <div>
                            <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">
                                Last Name
                            </label>
                            <input
                                    type="text"
                                    id="lastName"
                                    th:field="*{lastName}"
                                    required
                                    class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                      text-gray-700 placeholder-gray-400
                                      focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            />
                        </div>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            Email
                        </label>
                        <input
                                type="email"
                                id="email"
                                th:field="*{email}"
                                required
                                class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                  text-gray-700 placeholder-gray-400
                                  focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        />
                    </div>

                    <div th:if="${userUpdate.address != null}" class="border-t border-gray-300 pt-4 mt-4">
                        <h3 class="text-lg font-medium text-gray-700 mb-3">Address Information</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                            <div>
                                <label for="address.streetNumber" class="block text-sm font-medium text-gray-700 mb-1">
                                    Street Number
                                </label>
                                <input
                                        type="text"
                                        id="address.streetNumber"
                                        th:field="*{address.streetNumber}"
                                        class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                          text-gray-700 placeholder-gray-400
                                          focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                />
                            </div>
                            <div>
                                <label for="address.streetName" class="block text-sm font-medium text-gray-700 mb-1">
                                    Street Name
                                </label>
                                <input
                                        type="text"
                                        id="address.streetName"
                                        th:field="*{address.streetName}"
                                        class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                          text-gray-700 placeholder-gray-400
                                          focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                />
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 mt-4">
                            <div>
                                <label for="address.city" class="block text-sm font-medium text-gray-700 mb-1">
                                    City
                                </label>
                                <input
                                        type="text"
                                        id="address.city"
                                        th:field="*{address.city}"
                                        class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                          text-gray-700 placeholder-gray-400
                                          focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                />
                            </div>
                            <div>
                                <label for="address.postalCode" class="block text-sm font-medium text-gray-700 mb-1">
                                    Postal Code
                                </label>
                                <input
                                        type="text"
                                        id="address.postalCode"
                                        th:field="*{address.postalCode}"
                                        class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                          text-gray-700 placeholder-gray-400
                                          focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                />
                            </div>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button
                                type="submit"
                                class="w-full flex justify-center py-2 px-4 border border-transparent
                                  rounded-md shadow-sm text-sm font-medium text-white
                                  bg-blue-600 hover:bg-blue-700
                                  focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>

            <!-- View Mode -->
            <div th:unless="${isEditing}" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-gray-100 p-4 rounded-lg shadow">
                        <div class="flex items-center mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            <h3 class="text-lg font-medium text-gray-800">Personal Information</h3>
                        </div>
                        <div class="space-y-2 mt-4">
                            <p class="text-sm text-gray-600">First Name</p>
                            <p class="text-base font-medium text-gray-800" th:text="${user.firstName}">John</p>
                        </div>
                        <div class="space-y-2 mt-4">
                            <p class="text-sm text-gray-600">Last Name</p>
                            <p class="text-base font-medium text-gray-800" th:text="${user.lastName}">Doe</p>
                        </div>
                    </div>

                    <div class="bg-gray-100 p-4 rounded-lg shadow">
                        <div class="flex items-center mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                            <h3 class="text-lg font-medium text-gray-800">Contact Information</h3>
                        </div>
                        <div class="space-y-2 mt-4">
                            <p class="text-sm text-gray-600">Email</p>
                            <p class="text-base font-medium text-gray-800 break-words" th:text="${user.email}">johndoe@example.com</p>
                        </div>
                    </div>
                </div>

                <div th:if="${user.address != null}" class="bg-gray-100 p-4 rounded-lg shadow mt-4">
                    <div class="flex items-center mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1113.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <h3 class="text-lg font-medium text-gray-800">Address</h3>
                    </div>
                    <div class="mt-4">
                        <p class="text-base font-medium text-gray-800">
                            <span th:text="${user.address.streetNumber}">123</span>
                            <span th:text="${user.address.streetName}">Main Street</span>
                        </p>
                        <p class="text-base font-medium text-gray-800">
                            <span th:text="${user.address.postalCode}">10001</span>
                            <span th:text="${user.address.city}">New York</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
