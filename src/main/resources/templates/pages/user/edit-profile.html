<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="flex items-center justify-center min-h-screen px-4 py-6 sm:py-12">
    <div class="w-full max-w-2xl">
        <div class="bg-white py-6 px-4 sm:py-8 sm:px-6 md:px-10 shadow rounded-lg mb-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800">Edit Profile</h2>
                <a th:href="@{/profile}" class="flex items-center py-2 px-4 rounded-md text-sm font-medium bg-gray-500 text-white hover:bg-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    Cancel
                </a>
            </div>

            <!-- Success or error message -->
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" role="alert">
                <span th:text="${success}">Success message</span>
            </div>
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
                <span th:text="${error}">Error message</span>
            </div>

            <!-- Edit Form -->
            <form th:action="@{/profile/edit}" method="post" th:object="${userUpdate}" class="space-y-4 sm:space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">
                            First Name
                        </label>
                        <input type="text"
                               id="firstName"
                               name="firstName"
                               th:value="${firstName}"
                               required
                               class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                  text-gray-700 placeholder-gray-400
                                  focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        />
                    </div>
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">
                            Last Name
                        </label>
                        <input type="text"
                               id="lastName"
                               name="lastName"
                               th:value="${lastName}"
                               required
                               class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                  text-gray-700 placeholder-gray-400
                                  focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        />
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                        Email
                    </label>
                    <input type="email"
                           id="email"
                           name="email"
                           th:value="${email}"
                           required
                           class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                              text-gray-700 placeholder-gray-400
                              focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                    />
                </div>

                <div class="border-t border-gray-300 pt-6 mt-6">
                    <h3 class="text-lg font-medium text-gray-700 mb-4">Address Information</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                        <div>
                            <label for="address.streetNumber" class="block text-sm font-medium text-gray-700 mb-1">
                                Street Number
                            </label>
                            <input type="text"
                                   id="address.streetNumber"
                                   th:field="*{address.streetNumber}"
                                   class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                      text-gray-700 placeholder-gray-400
                                      focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            />
                        </div>
                        <div>
                            <label for="address.streetName" class="block text-sm font-medium text-gray-700 mb-1">
                                Street Name
                            </label>
                            <input type="text"
                                   id="address.streetName"
                                   th:field="*{address.streetName}"
                                   class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                      text-gray-700 placeholder-gray-400
                                      focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            />
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 mt-4">
                        <div>
                            <label for="address.city" class="block text-sm font-medium text-gray-700 mb-1">
                                City
                            </label>
                            <input type="text"
                                   id="address.city"
                                   th:field="*{address.city}"
                                   class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                      text-gray-700 placeholder-gray-400
                                      focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            />
                        </div>
                        <div>
                            <label for="address.postalCode" class="block text-sm font-medium text-gray-700 mb-1">
                                Postal Code
                            </label>
                            <input type="text"
                                   id="address.postalCode"
                                   th:field="*{address.postalCode}"
                                   class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3
                                      text-gray-700 placeholder-gray-400
                                      focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            />
                        </div>
                    </div>
                </div>

                <div class="pt-6">
                    <button type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent
                              rounded-md shadow-sm text-sm font-medium text-white
                              bg-blue-600 hover:bg-blue-700
                              focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
