<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Edit Collection</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}"/>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-8">
<div class="max-w-4xl mx-auto">
    <h1 class="text-4xl font-bold text-gray-800 mb-8 text-center">Edit Collection</h1>

    <div class="bg-white shadow-lg rounded-lg overflow-hidden mb-8">
        <div class="p-6">
            <form th:action="@{/collections/{id}/edit(id=${bookCollection.id})}" th:object="${bookCollection}" method="post" class="space-y-6">
                <input type="hidden" th:field="*{id}" />

                <div class="space-y-2">
                    <label for="title" class="text-sm font-medium text-gray-700">Collection Name</label>
                    <input type="text" id="title" name="title" th:field="*{title}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-red-500 text-xs mt-1"></p>
                </div>

                <div class="space-y-2">
                    <label for="description" class="text-sm font-medium text-gray-700">Description</label>
                    <textarea id="description" name="description" th:field="*{description}" rows="5"
                              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                    <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-red-500 text-xs mt-1"></p>
                </div>

                <div class="flex items-center">
<!--                    <input type="checkbox" id="public" name="public" th:checked="*{public}"-->
<!--                           class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">-->
                    <input type="checkbox" id="isPublic" name="isPublic" value="true" th:checked="*{public}"
                           class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="isPublic" class="ml-2 block text-sm text-gray-700">Make this collection public</label>
                    <p class="text-xs text-gray-500 ml-2">Public collections can be viewed by all users</p>
                </div>

                <div th:if="${error}" class="p-4 text-red-700 bg-red-100 rounded-md">
                    <p th:text="${error}"></p>
                </div>

                <div class="flex items-center justify-between pt-4">
                    <a th:href="@{/collections}" class="inline-block px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">Cancel</a>
                    <button type="submit" class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div class="mt-6 text-center">
        <a th:href="@{/collections/{id}(id=${bookCollection.id})}" class="inline-block px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">View Collection</a>
    </div>
</div>
</body>
</html>
