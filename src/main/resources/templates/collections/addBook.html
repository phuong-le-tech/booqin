<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book to Collection</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col items-center justify-start min-h-screen p-6">

<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg w-full">
    <div th:if="${collection}">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center" th:text="'Add Book to Collection: ' + ${collection.title}">Add Book to Collection</h1>

        <form th:action="@{/collections/{collectionId}/books/add(collectionId=${collection.id})}" method="post" class="space-y-4">
            <div>
                <label for="bookId" class="block text-gray-700">Select a Book:</label>
                <select id="bookId" name="bookId" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <option value="" disabled selected>Select a book</option>
                    <option th:each="book : ${books}" th:value="${book.id}" th:text="${book.title}"></option>
                </select>

            </div>
            <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition duration-300">Add Book</button>
        </form>

        <div class="mt-4 text-center">
            <a th:href="@{/collections/{collectionId}(collectionId=${collection.id})}" class="text-blue-600 hover:underline">Back to Collection</a>
        </div>
    </div>
    <!-- Message si la collection n'est pas trouvée -->
    <div th:unless="${collection}">
        <p class="text-red-500">Collection not found.</p>
    </div>
</div>

</body>
</html>
