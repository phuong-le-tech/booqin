<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Votre Panier</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center">Votre Panier</h2>

    <div th:if="${cart == null or cart.books.isEmpty()}" class="alert alert-warning text-center">
        <p>Votre panier est vide.</p>
        <a th:href="@{/books}" class="btn btn-primary">Parcourir la boutique</a>
    </div>

    <div th:if="${cart != null and not cart.books.isEmpty()}">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Titre</th>
                <th>Auteur</th>
                <th>Prix</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${cart.books}">
                <td th:text="${book.title}"></td>
                <td>
                    <form th:action="@{/cart/remove-book}" method="post">
                        <input type="hidden" name="userId" th:value="${cart.userId}">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <button type="submit" class="btn btn-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="text-end">
            <p><strong>Frais de livraison:</strong> 5.99 €</p>
            <p><strong>Total:</strong> <span th:text="${total} + ' €'"></span></p>
            <form th:action="@{/cart/clear-cart}" method="post">
                <input type="hidden" name="userId" th:value="${cart.userId}">
                <button type="submit" class="btn btn-warning">Vider le panier</button>
            </form>
            <form th:action="@{/payment/checkout}" method="post">
                <input type="hidden" name="cartId" th:value="${cart.id}">
                <button type="submit" class="btn btn-success mt-2">Payer maintenant</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
