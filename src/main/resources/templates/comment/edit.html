<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le commentaire</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <!-- Titre de la page -->
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Modifier le commentaire</h1>

    <!-- Formulaire de modification -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 p-6">
        <form method="post" th:action="@{/comments/update/{id}(id=${comment.id()})}">
            <input type="hidden" name="entityId" th:value="${entityId}" />
            <input type="hidden" name="entityType" th:value="${entityType}" />

            <div class="mb-4">
                <label for="comment" class="block text-sm font-medium text-gray-700 mb-2">Contenu du commentaire</label>
                <textarea id="comment" name="comment" rows="5"
                          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                          required
                          th:text="${comment.content()}"></textarea>
            </div>

            <div class="flex justify-between mt-6">
                <a th:href="@{${'/books/' + entityId}}"
                   class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">
                    Annuler
                </a>
                <button type="submit"
                        class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">
                    Enregistrer les modifications
                </button>
            </div>
        </form>
    </div>

    <!-- Informations sur le commentaire -->
    <div class="mt-6 text-sm text-gray-500">
        <p>
            Commentaire créé le <span th:text="${#temporals.format(comment.createdAt(), 'dd MMMM yyyy à HH:mm')}"></span>
        </p>
        <p th:if="${comment.updatedAt() != null}">
            Dernière modification le <span th:text="${#temporals.format(comment.updatedAt(), 'dd MMMM yyyy à HH:mm')}"></span>
        </p>
    </div>
</div>
</body>
</html>
