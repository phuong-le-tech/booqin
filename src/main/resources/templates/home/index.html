<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accueil (Session)</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col items-center justify-start min-h-screen p-6">

<div class="container mx-auto w-full max-w-screen-md">
    <!--<h1 class="text-4xl font-bold text-green-500 mb-6 text-center">Accueil</h1>-->
    <h1 class="text-center mb-4 text-3xl font-extrabold text-gray-900 md:text-5xl lg:text-6xl"><span class="text-transparent bg-clip-text bg-gradient-to-r to-emerald-600 from-sky-400">BooqIn</span> Accueil</h1>

    <!-- SI connecté -->
    <div th:if="${isAuthenticated}" class="bg-white p-8 rounded-lg shadow-lg w-full text-center">
        <p class="mb-4 text-lg">Vous êtes connecté en tant que <strong th:text="${username}" class="text-gray-800">User</strong>.</p>
        <p class="mb-6">Que souhaitez-vous consultez ?</p>
        <nav class="mb-6 space-y-2 space-x-5">
            <a th:href="@{/books}" class="inline-block px-4 py-2 bg-gradient-to-r from-blue-400 via-blue-500 to-blue-600 text-white rounded-lg hover:bg-teal-600 transition duration-300">Books</a>
            <a th:href="@{/collections/public}" class="inline-block px-4 py-2 bg-gradient-to-r from-teal-400 via-teal-500 to-teal-600 text-white rounded-lg hover:bg-blue-600 transition duration-300">Collections Publiques</a>
            <a th:href="@{/collections}" class="inline-block px-4 py-2 bg-gradient-to-r from-teal-400 via-teal-500 to-teal-600 text-white rounded-lg hover:bg-blue-600 transition duration-300">Mes Collections</a>
        </nav>
        <form th:action="@{/logout}" method="post" class="flex justify-center">
            <button type="submit" class="bg-red-500 text-white px-6 py-2 rounded-full hover:bg-red-600 transition duration-300">Se déconnecter</button>
        </form>
    </div>

    <!-- SI pas connecté -->
    <div th:unless="${isAuthenticated}" class="bg-white p-8 rounded-lg shadow-lg w-full text-center">
        <p class="mb-4 text-lg">Vous n'êtes pas connecté.</p>
        <p class="mb-6">
            <a th:href="@{/auth/login}" class="text-blue-600 hover:underline mr-2">Se connecter</a> |
            <a th:href="@{/auth/register}" class="text-blue-600 hover:underline">S'inscrire</a>
        </p>
    </div>
</div>

</body>
</html>
