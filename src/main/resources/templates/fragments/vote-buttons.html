<div th:fragment="voteButtons(entityId, entityType, redirectEntity, redirectId, userVotes)">
    <form th:action="@{/votes}" method="post" class="inline-flex items-center">
        <!-- Données de l'entité sur laquelle on vote -->
        <input type="hidden" name="entityId" th:value="${entityId}" />
        <input type="hidden" name="entityType" th:value="${entityType}" />

        <!-- Données pour la redirection -->
        <input type="hidden" name="redirectEntity" th:value="${redirectEntity}" />
        <input type="hidden" name="redirectId" th:value="${redirectId}" />

        <!-- Bouton upvote -->
        <button type="submit" name="voteType" value="UPVOTE"
                th:class="${userVotes != null && userVotes.containsKey(entityId) &&
                          userVotes.get(entityId) == T(fr.uge.booqIn.enums.VoteType).UPVOTE ?
                          'text-green-500 hover:text-green-600' :
                          'text-gray-400 hover:text-green-500'} + ' focus:outline-none mr-1'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z" />
            </svg>
        </button>

        <!-- Bouton downvote -->
        <button type="submit" name="voteType" value="DOWNVOTE"
                th:class="${userVotes != null && userVotes.containsKey(entityId) &&
                          userVotes.get(entityId) == T(fr.uge.booqIn.enums.VoteType).DOWNVOTE ?
                          'text-red-500 hover:text-red-600' :
                          'text-gray-400 hover:text-red-500'} + ' focus:outline-none'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M18 9.5a1.5 1.5 0 11-3 0v-6a1.5 1.5 0 013 0v6zM14 9.667v-5.43a2 2 0 00-1.105-1.79l-.05-.025A4 4 0 0011.055 2H5.64a2 2 0 00-1.962 1.608l-1.2 6A2 2 0 004.44 12H8v4a2 2 0 002 2 1 1 0 001-1v-.667a4 4 0 01.8-2.4l1.4-1.866a4 4 0 00.8-2.4z" />
            </svg>
        </button>
    </form>
</div>
