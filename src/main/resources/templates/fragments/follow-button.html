<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Follow Button Fragment -->
<div th:fragment="followButton(entityId, entityType, isFollowing, returnUrl)">
    <div th:if="${isAuthenticated}">
        <form th:if="${isFollowing}" th:action="@{/following/unfollow}" method="post">
            <input type="hidden" name="entityId" th:value="${entityId}" />
            <input type="hidden" name="entityType" th:value="${entityType}" />
            <input type="hidden" name="returnUrl" th:value="${returnUrl != null ? returnUrl : ''}" />
            <button type="submit" class="inline-flex items-center px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
                Following
            </button>
        </form>
        <form th:unless="${isFollowing}" th:action="@{/following/follow}" method="post">
            <input type="hidden" name="entityId" th:value="${entityId}" />
            <input type="hidden" name="entityType" th:value="${entityType}" />
            <input type="hidden" name="returnUrl" th:value="${returnUrl != null ? returnUrl : ''}" />
            <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Follow
            </button>
        </form>
    </div>
    <div th:unless="${isAuthenticated}">
        <a href="/auth/login" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Follow
        </a>
    </div>
</div>

<!-- Followers Count Fragment -->
<div th:fragment="followersCount(entityId, entityType, count)">
    <div class="inline-flex items-center text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1 text-blue-500" viewBox="0 0 20 20" fill="currentColor">
            <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z" />
        </svg>
        <span th:text="${count}"></span> followers
    </div>
</div>
</body>
</html>
