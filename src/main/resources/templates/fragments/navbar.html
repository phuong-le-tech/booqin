<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Navbar fragment to be included in other templates -->
<nav th:fragment="navbar" style="background-color: #111827; border-bottom: 1px solid #1e293b;">
    <!-- Top Navigation Bar -->
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <a href="/" class="text-3xl font-extrabold text-white hover:text-blue-300 transition-colors">
                <!-- Book icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="inline-block h-6 w-6 mr-2" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
                BooqIn
            </a>

            <!-- Navigation Links - Desktop -->
            <div class="hidden md:flex items-center space-x-4">
                <a href="/books" class="text-white hover:text-blue-300 px-3 py-2 rounded-md text-base font-medium"
                   th:classappend="${currentPage == 'books'} ? 'bg-gray-800' : ''">Books</a>
                <a href="/collections/public"
                   class="text-white hover:text-blue-300 px-3 py-2 rounded-md text-base font-medium"
                   th:classappend="${currentPage == 'collections-public'} ? 'bg-gray-800' : ''">Collections</a>

                <!-- Authenticated-only links -->
                <a th:if="${isAuthenticated}" href="/loans"
                   class="text-white hover:text-blue-300 px-3 py-2 rounded-md text-base font-medium"
                   th:classappend="${currentPage == 'book-lending'} ? 'bg-gray-800' : ''">Dashboard</a>
                <a th:if="${isAuthenticated}" href="/collections"
                   class="text-white hover:text-blue-300 px-3 py-2 rounded-md text-base font-medium"
                   th:classappend="${currentPage == 'collections'} ? 'bg-gray-800' : ''">My Collections</a>
                <a th:if="${isAuthenticated}" href="/following"
                   class="text-white hover:text-blue-300 px-3 py-2 rounded-md text-base font-medium"
                   th:classappend="${currentPage == 'following'} ? 'bg-gray-800' : ''">Following</a>
                <a th:if="${isAdmin}" href="/admin"
                   class="text-white hover:text-blue-300 px-3 py-2 rounded-md text-base font-medium"
                   th:classappend="${currentPage == 'admin'} ? 'bg-gray-800' : ''">Admin</a>
            </div>

            <!-- User Section -->
            <div class="flex items-center space-x-4">
                <!-- Shopping Cart -->
                <a href="/cart" class="text-white hover:text-blue-300">
                    <!-- Cart icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                </a>

                <!-- Not Authenticated -->
                <div th:unless="${isAuthenticated}" class="flex items-center space-x-2">
                    <a href="/auth/login" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm">
                        Login
                    </a>
                    <a href="/auth/register" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm">
                        Register
                    </a>
                </div>

                <!-- Authenticated -->
                <div th:if="${isAuthenticated}" class="flex items-center space-x-3">
                    <!-- Notifications -->
                    <div th:replace="~{fragments/notification-dropdown :: notification-dropdown}"></div>

                    <!-- User Menu -->
                    <a href="/profile" class="flex items-center text-white hover:text-blue-300">
                        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center mr-2">
                            <span th:text="${#strings.substring(username, 0, 1).toUpperCase()}">U</span>
                        </div>
                        <span class="hidden md:inline mr-1" th:text="${username}">User</span>
                    </a>

                    <!-- Logout -->
                    <form th:action="@{/auth/logout}" method="post" class="hidden md:block">
                        <button type="submit" class="text-red-400 hover:text-red-300">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
