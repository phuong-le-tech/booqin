<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>
<!-- Comment Item Fragment -->
<div th:fragment="commentItem(comment, depth)">
    <div class="p-4 border border-gray-200 rounded-lg mb-4 bg-white hover:bg-gray-50 transition-colors duration-200"
         th:class="${depth > 0 ? 'p-4 border border-gray-200 rounded-lg mb-4 bg-white hover:bg-gray-50 transition-colors duration-200 ml-12' : 'p-4 border border-gray-200 rounded-lg mb-4 bg-white hover:bg-gray-50 transition-colors duration-200'}">

        <!-- Comment Header with User Info -->
        <div class="flex items-start">
            <div class="h-10 w-10 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium flex-shrink-0">
                <span th:text="${comment.username != null && !comment.username.isEmpty() ? comment.username.substring(0,1).toUpperCase() : 'U'}">U</span>
            </div>
            <div class="ml-3">
                <div class="flex items-center">
                    <span class="font-semibold text-gray-900" th:text="${comment.username}">Username</span>
                    <span class="ml-2 text-base text-gray-500" th:text="${#temporals.format(comment.createdAt, 'dd MMM yyyy, HH:mm')}">Date</span>
                    <span th:if="${comment.updatedAt != null && !comment.updatedAt.equals(comment.createdAt)}"
                          class="ml-2 text-base text-gray-500"
                          title="Last updated">
              (edited)
            </span>
                </div>
            </div>
        </div>

        <!-- Comment Content -->
        <div class="mt-3 pl-12">
            <p class="text-gray-800 whitespace-pre-line text-base" th:text="${comment.content}">Comment content goes here.</p>
        </div>

        <!-- Comment Actions -->
        <div class="mt-3 pl-12 flex items-center text-base text-gray-500">
            <button th:if="${user != null}"
                    th:onclick="'toggleReplyForm(' + ${comment.id} + ')'"
                    class="text-blue-600 hover:text-blue-800 hover:underline focus:outline-none mr-4">
                Reply
            </button>
            <button th:if="${user != null && user.id == comment.userId}"
                    th:onclick="'toggleEditForm(' + ${comment.id} + ')'"
                    class="text-blue-600 hover:text-blue-800 hover:underline focus:outline-none mr-4">
                Edit
            </button>
            <form th:if="${user != null && user.id == comment.userId}"
                  th:action="@{/comments/{id}/delete(id=${comment.id})}"
                  method="post"
                  class="inline"
                  onsubmit="return confirm('Are you sure you want to delete this comment?');">
                <input type="hidden" name="entityId" th:value="${comment.entityId}" />
                <input type="hidden" name="entityType" th:value="${comment.entityType}" />
                <button type="submit" class="text-red-600 hover:text-red-800 hover:underline focus:outline-none">
                    Delete
                </button>
            </form>
        </div>

        <!-- Reply Form (hidden by default) -->
        <div th:if="${user != null}" th:id="'replyForm-' + ${comment.id}" class="mt-4 pl-12 hidden">
            <form th:action="@{/comments}" method="post">
          <textarea name="content"
                    placeholder="Write your reply..."
                    rows="3"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none transition-all duration-200"
                    required
                    maxlength="1000"></textarea>
                <div class="mt-2 flex justify-end space-x-2">
                    <button type="button"
                            th:onclick="'toggleReplyForm(' + ${comment.id} + ')'"
                            class="px-3 py-1 text-sm text-gray-600 hover:text-gray-800 focus:outline-none">
                        Cancel
                    </button>
                    <button type="submit"
                            class="px-3 py-1 bg-blue-600 text-white text-sm rounded-md hover:bg-blue-700 focus:outline-none">
                        Reply
                    </button>
                </div>
                <input type="hidden" name="userId" th:value="${user != null ? user.id : ''}" />
                <input type="hidden" name="entityId" th:value="${comment.entityId}" />
                <input type="hidden" name="entityType" th:value="${comment.entityType}" />
                <input type="hidden" name="parentId" th:value="${comment.id}" />
                <input type="hidden" name="redirectParams" value="highlight={newCommentId}" />
            </form>
        </div>

        <!-- Edit Form (hidden by default) -->
        <div th:if="${user != null && user.id == comment.userId}" th:id="'editForm-' + ${comment.id}" class="mt-4 pl-12 hidden">
            <form th:action="@{/comments/{id}/update(id=${comment.id})}" method="post">
          <textarea name="content"
                    rows="3"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none transition-all duration-200"
                    required
                    maxlength="1000"
                    th:text="${comment.content}"></textarea>
                <div class="mt-2 flex justify-end space-x-2">
                    <button type="button"
                            th:onclick="'toggleEditForm(' + ${comment.id} + ')'"
                            class="px-3 py-1 text-sm text-gray-600 hover:text-gray-800 focus:outline-none">
                        Cancel
                    </button>
                    <button type="submit"
                            class="px-3 py-1 bg-blue-600 text-white text-sm rounded-md hover:bg-blue-700 focus:outline-none">
                        Update
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Nested Replies (recursively display child comments) -->
    <div th:if="${!comment.replies.isEmpty()}" class="ml-12">
        <div th:each="reply : ${comment.replies}">
            <div th:replace="~{fragments/comment :: commentItem(comment=${reply}, depth=${depth + 1})}"></div>
        </div>
    </div>
</div>
</body>
</html>
