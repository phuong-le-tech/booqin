<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Liste des Livres</title>
    <!-- Inclusion de Tailwind CSS via un CDN (exemple) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="container mx-auto">
    <!-- Grille responsive : 1 colonne sur mobile, 2 sur écran md, 3 sur écran lg -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" th:each="book : ${books}">
        <!-- Carte -->
        <div class="bg-white rounded-lg shadow p-4 flex flex-col">
            <!-- Image placeholder -->
            <div class="w-full h-40 bg-gray-300 flex items-center justify-center mb-4">
                <span class="text-gray-700 font-semibold">Image Unavailable</span>
            </div>

            <!-- Titre du livre -->
            <h2 class="text-lg font-bold mb-2" th:text="${book.title}">
                Titre du Livre
            </h2>
        </div>
    </div>
</div>
</body>
</html>
