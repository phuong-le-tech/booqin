<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Grid</title>
    <!-- Ajout de Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
<!-- En-tête avec titre et bouton d'ajout -->
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Books Collection</h1>
    <a th:href="@{/books/new}" class="bg-green-600 text-white px-4 py-2 rounded-md transition hover:bg-green-700 font-medium flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        Add New Book
    </a>
</div>

<!-- Formulaire de recherche et de filtrage -->
<div class="bg-white rounded-lg shadow-sm p-6 mt-8">
    <h3 class="text-lg font-bold text-gray-800 mb-4">Search & Filter Books</h3>
    <form th:action="@{/books}" method="get" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="flex flex-col">
            <label for="title" class="text-sm font-medium text-gray-700 mb-1">Title</label>
            <input type="text" id="title" name="title" th:value="${title}"
                   class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex flex-col">
            <label for="author" class="text-sm font-medium text-gray-700 mb-1">Author</label>
            <input type="text" id="author" name="author" th:value="${author}"
                   class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex flex-col">
            <label for="isbn" class="text-sm font-medium text-gray-700 mb-1">ISBN</label>
            <input type="text" id="isbn" name="isbn" th:value="${isbn}"
                   class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex flex-col items-end justify-end">
            <button type="submit"
                    class="bg-blue-600 text-white px-4 py-2 rounded-md transition hover:bg-blue-700 font-medium">
                Search
            </button>
        </div>

        <!-- Champs cachés pour maintenir la pagination et le tri -->
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="direction" th:value="${direction}">
    </form>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" th:if="${not #lists.isEmpty(books)}">
    <div th:each="book : ${books}" class="bg-white border border-gray-200 rounded-xl shadow-sm flex flex-col transition duration-300 hover:shadow-md hover:-translate-y-1 book-item">
        <div class="w-full h-48 flex justify-center items-center text-2xl text-white rounded-t-xl"
             th:style="'background-color: ' + ${T(java.lang.String).format('#%06x', T(java.lang.Math).abs(book.id().hashCode()) % 0xFFFFFF)}">
            <span th:text="${book.title().substring(0, 1).toUpperCase()}"></span>
        </div>
        <div class="p-4 flex flex-col flex-grow">
            <h3 class="text-lg font-bold text-gray-800 mb-1 line-clamp-2" th:text="${book.title()}"></h3>
            <!-- Correction pour utiliser authorNames au lieu de authors -->
            <p class="text-sm text-blue-600 font-medium mb-2 truncate" th:text="${#strings.abbreviate(book.authorNames() != null and !book.authorNames().isEmpty() ? #strings.listJoin(book.authorNames(), ', ') : 'Unknown Author', 50)}"></p>
            <!-- Affichage correct de la date de publication -->
            <p th:if="${book.publicationDate() != null}" class="text-xs text-gray-500 mb-3" th:text="'Published: ' + ${#dates.format(book.publicationDate(), 'yyyy-MM-dd')}"></p>
            <p th:if="${book.publicationDate() == null}" class="text-xs text-gray-500 mb-3">Published: Unknown date</p>
            <!-- Le record BookIndex ne semble pas avoir de description, donc je l'ai retiré -->
            <a class="mt-auto text-center py-2 px-4 bg-blue-600 text-white text-sm font-medium rounded-lg transition hover:bg-blue-700" th:href="@{'/books/' + ${book.id()}}">View details</a>
            <!-- Boutons pour les actions -->
            <div class="flex gap-2 mt-2">
                <!-- Bouton Add to Cart -->
                <form th:action="@{/cart/add-book}" method="post" class="flex-1">
                    <input type="hidden" name="bookId" th:value="${book.id()}" />
                    <input type="hidden" name="userId" th:value="${userId}">
                    <button type="submit" class="w-full text-center py-2 px-4 bg-green-600 text-white text-sm font-medium rounded-lg transition hover:bg-green-700">Add to Cart</button>
                </form>
                <!-- Bouton Add to Collection -->
<!--                <a th:href="@{/collections/{collectionId}/books/add(collectionId=${collection.id})}" class="flex-1 text-center py-2 px-4 bg-indigo-600 text-white text-sm font-medium rounded-lg transition hover:bg-indigo-700">-->
<!--                    Add to Collection-->
<!--                </a>-->
            </div>
        </div>
    </div>
</div>

<div class="text-center py-8" th:if="${#lists.isEmpty(books)}">
    <p class="text-lg font-medium text-gray-700">No books available</p>
    <p class="text-sm text-gray-500">Try adjusting your search or check back later</p>
</div>

<!-- Pagination avec paramètres de recherche et de tri -->
<div class="flex items-center justify-center gap-2 my-6" th:if="${totalPages > 1}"
     th:with="visiblePages=5,
              startPage=${(currentPage - 2 < 0) ? 0 : ((currentPage + 2 >= totalPages) ? (totalPages - visiblePages < 0 ? 0 : totalPages - visiblePages) : currentPage - 2)},
              endPage=${(startPage + visiblePages - 1 >= totalPages) ? (totalPages - 1) : (startPage + visiblePages - 1)}">

    <button class="w-10 h-10 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-blue-600 transition hover:bg-blue-600 hover:text-white"
            th:if="${currentPage > 0}"
            th:onclick="'window.location.href=\'' + @{/books(page=${currentPage - 1}, title=${title}, author=${author}, isbn=${isbn}, sort=${sort}, direction=${direction})} + '\''">
        <span class="nav-icon">&#8592;</span>
    </button>

    <!-- Premier numéro de page avec ellipsis si nécessaire -->
    <div class="min-w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer transition text-sm text-gray-800 hover:bg-gray-200"
         th:if="${startPage > 0}"
         th:onclick="'window.location.href=\'' + @{/books(page=0, title=${title}, author=${author}, isbn=${isbn}, sort=${sort}, direction=${direction})} + '\''">
        <span>1</span>
    </div>

    <div class="flex items-center justify-center text-sm text-gray-500 tracking-wider" th:if="${startPage > 1}">...</div>

    <!-- Pages visibles dans la fenêtre coulissante -->
    <div class="flex items-center gap-1">
        <div class="min-w-9 h-9 rounded-full flex items-center justify-center cursor-pointer transition text-sm"
             th:each="i : ${#numbers.sequence(startPage, endPage)}"
             th:classappend="${currentPage == i} ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-800 hover:bg-gray-200'"
             th:onclick="'window.location.href=\'' + @{/books(page=${i}, title=${title}, author=${author}, isbn=${isbn}, sort=${sort}, direction=${direction})} + '\''">
            <span th:text="${i + 1}"></span>
        </div>
    </div>

    <!-- Dernier numéro de page avec ellipsis si nécessaire -->
    <div class="flex items-center justify-center text-sm text-gray-500 tracking-wider" th:if="${endPage < totalPages - 2}">...</div>

    <div class="min-w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer transition text-sm text-gray-800 hover:bg-gray-200"
         th:if="${endPage < totalPages - 1}"
         th:onclick="'window.location.href=\'' + @{/books(page=${totalPages - 1}, title=${title}, author=${author}, isbn=${isbn}, sort=${sort}, direction=${direction})} + '\''">
        <span th:text="${totalPages}"></span>
    </div>

    <button class="w-10 h-10 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-blue-600 transition hover:bg-blue-600 hover:text-white"
            th:if="${currentPage < totalPages - 1}"
            th:onclick="'window.location.href=\'' + @{/books(page=${currentPage + 1}, title=${title}, author=${author}, isbn=${isbn}, sort=${sort}, direction=${direction})} + '\''">
        <span class="nav-icon">&#8594;</span>
    </button>
</div>
</body>
<script th:if="${userId != null}" th:inline="javascript">
    // Get the collections data from Thymeleaf model
    const userCollections = /*[[${bookCollections}]]*/ [];

    function addToCollection(bookId, collectionId) {
        console.log(`Adding book ${bookId} to collection ${collectionId}`);

        // Create form data
        const formData = new FormData();
        formData.append('bookId', bookId);

        // Make AJAX POST request
        fetch(`/collections/${collectionId}/books/add`, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
            .then(response => {
                if (response.ok) {
                    // Show success message
                    const successPopup = document.getElementById('success-popup');
                    if (successPopup) {
                        successPopup.classList.remove('hidden');
                        setTimeout(() => {
                            successPopup.classList.add('hidden');
                        }, 2000);
                    } else {
                        alert(`Book successfully added to collection!`);
                    }
                    return response.text();
                } else {
                    throw new Error('Failed to add book to collection');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to add book to collection. Please try again.');
            });

        // Close the modal after adding
        const modal = document.getElementById('collection-modal');
        if (modal) {
            modal.classList.add('hidden');
        }

        return false; // Prevent default link behavior
    }

    function showCollectionsModal(bookId) {
        // Remove any existing modal
        const existingModal = document.getElementById('collection-modal');
        if (existingModal) {
            existingModal.remove();
        }

        // Create modal backdrop and container
        const modal = document.createElement('div');
        modal.id = 'collection-modal';
        modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50';

        // Create modal content
        let modalContent = `
            <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden transform transition-all">
                <div class="bg-blue-600 px-4 py-3 flex justify-between items-center">
                    <h3 class="text-lg font-medium text-white">Add to Collection</h3>
                    <button onclick="document.getElementById('collection-modal').classList.add('hidden')" class="text-white hover:text-gray-200 focus:outline-none">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <div class="p-4 max-h-96 overflow-y-auto">`;

        // Add collections list
        if (userCollections && userCollections.length > 0) {
            modalContent += `<div class="space-y-2">`;
            userCollections.forEach(collection => {
                modalContent += `
                    <div class="hover:bg-gray-100 p-2 rounded-md cursor-pointer flex items-center"
                         onclick="addToCollection('${bookId}', '${collection.id}')">
                        <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white mr-3">
                            ${collection.title.charAt(0).toUpperCase()}
                        </div>
                        <div class="font-medium">${collection.title}</div>
                    </div>`;
            });
            modalContent += `</div>`;
        } else {
            modalContent += `
                <div class="text-center py-8">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                    </svg>
                    <p class="mt-2 text-gray-500">No collections available</p>
                    <p class="text-sm text-gray-400 mt-1">Create a collection first to add books</p>
                </div>`;
        }

        modalContent += `
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button onclick="document.getElementById('collection-modal').classList.add('hidden')" class="w-full sm:w-auto px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 focus:outline-none">
                        Cancel
                    </button>
                </div>
            </div>`;

        modal.innerHTML = modalContent;
        document.body.appendChild(modal);

        // Create success popup if it doesn't exist
        if (!document.getElementById('success-popup')) {
            const successPopup = document.createElement('div');
            successPopup.id = 'success-popup';
            successPopup.className = 'fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 rounded-md shadow-lg hidden transform transition-all duration-300';
            successPopup.innerHTML = `Book successfully added to collection! <span class="ml-2">✓</span>`;
            document.body.appendChild(successPopup);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.book-item').forEach(function(bookItem) {
            bookItem.addEventListener('contextmenu', function(event) {
                event.preventDefault();

                // Remove any existing dropdown menus
                const existingMenus = document.querySelectorAll('.dropdown-menu');
                existingMenus.forEach(menu => menu.remove());

                // Create new dropdown menu
                const dropdownMenu = document.createElement('div');
                dropdownMenu.classList.add('dropdown-menu', 'absolute', 'bg-white', 'shadow-lg', 'rounded-md', 'p-2', 'z-50');

                // Position the dropdown near the cursor
                dropdownMenu.style.top = `${event.pageY}px`;
                dropdownMenu.style.left = `${event.pageX}px`;

                // Get the book ID from the closest parent element
                const bookElement = bookItem.closest('.bg-white.border');
                const bookId = bookElement ? bookElement.querySelector('form input[name="bookId"]').value : 'placeholder-book-id';

                // Set the dropdown HTML content with just one option to open the modal
                dropdownMenu.innerHTML = `
                <a href="#" class="block px-4 py-2 text-gray-800 hover:bg-gray-200 rounded-md" onclick="event.preventDefault(); showCollectionsModal('${bookId}');">
                    Ajouter à une collection
                </a>`;

                document.body.appendChild(dropdownMenu);

                // Close dropdown when clicking anywhere else
                document.addEventListener('click', function closeMenu() {
                    dropdownMenu.remove();
                    document.removeEventListener('click', closeMenu);
                });

                // Close dropdown when pressing escape
                document.addEventListener('keydown', function escHandler(e) {
                    if (e.key === 'Escape') {
                        dropdownMenu.remove();
                        document.removeEventListener('keydown', escHandler);
                    }
                });
            });
        });
    });
</script>
</html>
